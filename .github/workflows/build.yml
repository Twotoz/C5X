name: C5X R0 CI

on:
  push:
    branches:
      - main
      - "r0-**"
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-C5 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          idf.py build

      - name: Check host analysis tool
        shell: bash
        run: |
          python3 -m py_compile tools/analyze_capture.py
